{{- $architecture := or .architecture "amd64" -}}
{{- $device := or .device "amd64" }}
{{- $nonfree := or .nonfree "false" }}

architecture: {{ $architecture }}

actions:
  - action: apt
    recommends: true
    description: Install device-specific base packages
    packages:
      - linux-image-amd64
      - grub-efi
      - firmware-linux-free
{{ if eq $nonfree "true" }}
      - atmel-firmware
      - bluez-firmware
      - dahdi-firmware-nonfree
      - firmware-ast
      - firmware-atheros
      - firmware-bnx2
      - firmware-bnx2x
      - firmware-brcm80211
      - firmware-cavium
      - firmware-cirrus
      - firmware-intel-sound
      - firmware-iwlwifi
      - firmware-libertas
      - firmware-linux-nonfree
      - firmware-marvell-prestera
      - firmware-myricom
      - firmware-netronome
      - firmware-netxen
      - firmware-qlogic
      - firmware-realtek
      - firmware-siano
      - firmware-sof-signed
      - firmware-zd1211
{{ end }}
