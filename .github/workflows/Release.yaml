name: Build Mobian PinePhone Pro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bmap-tools jq

      - name: Build custom debos image
        run: |
          docker build \
            -t mobian-testing/debos-cryptsetup \
            -f Docker/Dockerfile.debos \
            .

      - name: Build image
        run: |
          device="pinephonepro"
          environment="phosh"
          arch="arm64"
          family="rockchip"
          partitiontable="gpt"
          filesystem="ext4"
          image_file="mobian-${device}-${environment}-$(date +%Y%m%d)"
          rootfs_file="rootfs-${arch}-${environment}-nonfree.tar.xz"
          installfs_file="installfs-${arch}.tar.xz"

          docker run --rm \
            --privileged \
            --device /dev/kvm \
            -v "$PWD":/work \
            -w /work \
            mobian-testing/debos-cryptsetup \
            -t architecture:${arch} \
            -t family:${family} \
            -t device:${device} \
            -t partitiontable:${partitiontable} \
            -t filesystem:${filesystem} \
            -t environment:${environment} \
            -t image:${image_file} \
            -t rootfs:${rootfs_file} \
            -t installfs:${installfs_file} \
            -t debian_suite:forky \
            -t suite:forky \
            -t nonfree:true \
            --scratchsize=8G \
            rootfs.yaml

          docker run --rm \
            --privileged \
            --device /dev/kvm \
            -v "$PWD":/work \
            -w /work \
            mobian-testing/debos-cryptsetup \
            -t architecture:${arch} \
            -t family:${family} \
            -t device:${device} \
            -t partitiontable:${partitiontable} \
            -t filesystem:${filesystem} \
            -t environment:${environment} \
            -t image:${image_file} \
            -t rootfs:${rootfs_file} \
            -t installfs:${installfs_file} \
            -t debian_suite:forky \
            -t suite:forky \
            -t nonfree:true \
            --scratchsize=8G \
            image.yaml

          bmaptool create "${image_file}.img" > "${image_file}.img.bmap"

      - name: Generate SHA256
        run: |
          image=$(ls mobian-pinephonepro-phosh-*.img | head -n 1)
          sha256sum "$image" | tee "$image.sha256"

      - name: Upload image to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_FOLDER_ID: ${{ secrets.GOFILE_FOLDER_ID }}
        run: |
          image=$(ls mobian-pinephonepro-phosh-*.img | head -n 1)
          FILE_IMG="$image"
          FILE_SHA="$image.sha256"
          FILE_BMAP="$image.bmap"

          for f in "$FILE_IMG" "$FILE_SHA" "$FILE_BMAP"; do
            if [ ! -f "$f" ]; then
              echo "❌ File not found: $f"
              exit 1
            fi
          done

          echo "📡 Getting GoFile server..."
          SERVER_JSON=$(curl -s "https://api.gofile.io/servers")
          SERVER=$(echo "$SERVER_JSON" | jq -r '.data.servers[0].name')

          if [ -z "$SERVER" ] || [ "$SERVER" = "null" ]; then
            echo "❌ Failed to get GoFile server"
            echo "$SERVER_JSON"
            exit 1
          fi

          echo "🖥️ Using server: $SERVER"

          upload() {
            local file="$1"
            echo "📤 Uploading $file"
            RESPONSE=$(curl -s -X POST "https://${SERVER}.gofile.io/uploadFile" \
              -H "Authorization: Bearer $GOFILE_TOKEN" \
              -F "file=@${file}" \
              -F "folderId=${GOFILE_FOLDER_ID}")

            LINK=$(echo "$RESPONSE" | jq -r '.data.downloadPage')
            if [ -z "$LINK" ] || [ "$LINK" = "null" ]; then
              echo "❌ Upload failed for $file"
              echo "$RESPONSE"
              exit 1
            fi

            echo "✅ Uploaded $file"
            echo "🔗 $LINK"
          }

          upload "$FILE_IMG"
          upload "$FILE_SHA"
          upload "$FILE_BMAP"
